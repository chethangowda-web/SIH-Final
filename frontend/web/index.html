<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="PDS DemandSync - Forward-Looking Beneficiary Intent for Pre-Dispatch PDS Demand Forecasting (SIH 2026)">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PDS DemandSync">

  <title>PDS DemandSync - Pre-Dispatch Demand Forecasting</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 999999;
      transition: opacity 0.35s ease-out;
    }
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 40px;
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      max-width: 360px;
      width: 90%;
      text-align: center;
    }
    .splash-icon {
      width: 52px;
      height: 52px;
      margin-bottom: 16px;
      background: #F1F5F9;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #CBD5E1;
    }
    .splash-title {
      font-size: 20px;
      font-weight: 800;
      color: #0F2942;
      margin: 0 0 4px 0;
      letter-spacing: -0.3px;
    }
    .splash-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: #64748B;
      margin: 0 0 20px 0;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 5px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #FF9933, #0F2942, #138808);
      border-radius: 999px;
      animation: indeterminate 1.4s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 55%; }
      100% { left: 100%; width: 40%; }
    }
    .splash-status {
      font-size: 11px;
      color: #94A3B8;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="splash-card">
      <div class="splash-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0F2942" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <h1 class="splash-title">PDS DemandSync</h1>
      <p class="splash-subtitle">Department of Food & Civil Supplies</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill"></div>
      </div>
      <span class="splash-status">Initializing Pre-Dispatch Intelligence Engine...</span>
    </div>
  </div>

  <script>
    // Smoothly remove splash as soon as Flutter renders the first frame
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 350);
      }
    });

    // Safety fallback: dismiss splash after 4.5s max if event was already fired
    setTimeout(function() {
      var splash = document.getElementById('loading-splash');
      if (splash && splash.style.opacity !== '0') {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 350);
      }
    }, 4500);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
